name: Build FotoRapiAI v4

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FotoRapiAI v4
        shell: bash
        run: |
          set -e
          test -f fotorapi-v4-source.zip
          rm -rf app
          rm -f build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p /tmp/fotorapi-v4
          unzip -q fotorapi-v4-source.zip -d /tmp/fotorapi-v4
          cp -a /tmp/fotorapi-v4/. .
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/fotorapi/app/MainActivity.kt

      - name: Download MI-GAN model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-all-errors \
            "https://huggingface.co/litert-community/MI-GAN-512-Places2-LiteRT/resolve/main/migan_fp16.tflite?download=true" \
            -o app/src/main/assets/migan_fp16.tflite
          test -s app/src/main/assets/migan_fp16.tflite
          ls -lh app/src/main/assets/migan_fp16.tflite

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle --version
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoRapiAI-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
